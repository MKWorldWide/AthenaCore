version: '3.8'

services:
  athenacore:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: athenacore-kernel
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Uncomment and configure when ready to integrate with Serafina
  # serafina:
  #   image: serafina:latest
  #   container_name: serafina
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #   depends_on:
  #     - athenacore
  #   ports:
  #     - "8002:8002"
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

networks:
  default:
    driver: bridge
    name: athena-network
