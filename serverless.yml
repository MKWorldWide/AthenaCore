service: athenacore

frameworkVersion: '3'

plugins:
  - serverless-plugin-typescript
  - serverless-offline
  - serverless-dotenv-plugin

package:
  patterns:
    - '!node_modules/.prisma/client/libquery_engine-*'
    - '!node_modules/.prisma/client/libquery_engine.*'
    - '!node_modules/prisma/libquery_engine-*'
    - '!node_modules/prisma/libquery_engine.*'
    - '!node_modules/@prisma/engines/**'
    - '!node_modules/.prisma/client/schema.prisma'
    - '!node_modules/.prisma/client/query_*'
    - '!node_modules/prisma/migrations/'
    - '!node_modules/prisma/schema.prisma'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    NODE_ENV: ${self:provider.stage}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - 'lambda:InvokeFunction'
            - 's3:*'
            - 'dynamodb:*'
            - 'sqs:*'
            - 'sns:*'
          Resource: '*'

functions:
  api:
    handler: src/handlers/api.handler
    events:
      - http:
          path: /
          method: ANY
          cors: true
      - http:
          path: /{proxy+}
          method: ANY
          cors: true

  processQuantumTask:
    handler: src/handlers/processQuantumTask.handler
    events:
      - sqs:
          arn:
            Fn::GetAtt: [QuantumTaskQueue, Arn]
          batchSize: 1

custom:
  serverless-offline:
    httpPort: 4000
    lambdaPort: 3002
    noPrependStageInUrl: true
    useChildProcesses: true
  dotenv:
    path: ./.env.${self:provider.stage}
    include: false

dotenv:
  required:
    file: ./.env.${self:provider.stage}

resources:
  Resources:
    QuantumTaskQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-quantum-tasks-${self:provider.stage}
        VisibilityTimeout: 900
        MessageRetentionPeriod: 1209600  # 14 days in seconds

  Outputs:
    ApiGatewayRestApi:
      Description: 'API Gateway endpoint URL for Prod stage'
      Value:
        'Fn::Join':
          - ''
          - - 'https://'
            - !Ref 'ApiGatewayRestApi'
            - '.execute-api.${self:provider.region}.amazonaws.com/${self:provider.stage}'
    QuantumTaskQueueUrl:
      Description: 'SQS Queue URL for quantum tasks'
      Value:
        Ref: QuantumTaskQueue
    QuantumTaskQueueArn:
      Description: 'SQS Queue ARN for quantum tasks'
      Value:
        'Fn::GetAtt': [QuantumTaskQueue, Arn]
